name: "Human Oversight Decision Log"
description: "Record a human-in-the-loop review decision for an AI output. Captures reviewer identity, decision (accept / edit / reject), rationale, and writes the event into the tamper-evident audit chain. Satisfies Article 14 human oversight evidence requirements."
default_model: haiku
default_max_turns: 5
default_timeout: 300
risk_level: limited

input_schema:
  required: ["run_id", "step_id", "ai_output"]
  properties:
    run_id:
      type: string
      description: "Run ID of the workflow whose output is being reviewed"
    step_id:
      type: string
      description: "Step ID being reviewed"
    ai_output:
      type: string
      description: "The AI-generated output requiring review"
    reviewer_role:
      type: string
      description: "Role of the reviewer (e.g. underwriter, clinician, compliance officer)"

steps:
  - id: "summarise_for_reviewer"
    prompt: |
      Produce a concise (max 200 words) summary of the following AI output for a
      {input.reviewer_role} reviewer. Highlight any high-confidence claims, any
      uncertainty, and any decisions the reviewer is being asked to confirm:
      {input.ai_output}

  - id: "human_decision"
    type: "approval"
    prompt: "Reviewer decision"
    approval_config:
      message: "AI output for run {input.run_id}, step {input.step_id}. Accept, edit, or reject. Your decision and identity will be written to the Article 12 audit chain."
      show_data: "steps.summarise_for_reviewer.output"
      timeout_hours: 72
      on_timeout: "abort"
      allow_edit: true
    depends_on:
      - "summarise_for_reviewer"

  - id: "record_decision"
    type: "code"
    prompt: "Record the decision to the audit chain"
    code_config:
      language: "python"
      code: |
        # Append a structured human-oversight event to the audit trail.
        # The Sandcastle audit chain auto-hashes the event into the SHA-256 chain.
        import json
        event = {
            "type": "human_oversight",
            "article": "AI Act Art. 14",
            "run_id": "placeholder",
            "step_id": "placeholder",
            "note": "Real wiring is via /api/audit/append at runtime"
        }
        print(json.dumps(event))
    depends_on:
      - "human_decision"

on_complete:
  storage_path: "compliance/oversight-log/{run_id}/event.json"
