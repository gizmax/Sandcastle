name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Protected tags and the pypi environment gate releases from main pushes.
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check if version already exists on PyPI
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__\\s*=\\s*\"(.+?)\"', open('src/sandcastle/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/sandcastle-ai/$VERSION/json)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already on PyPI - skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not on PyPI - will publish"
          fi

  test:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard
        run: cd dashboard && npm ci && npm run build
      - name: TypeScript check
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,memory,otel,parse,report,docker,security]"
      - name: Validate Compose files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for name in (
              "docker-compose.yml",
              "docker-compose.local.yml",
              "docker-compose.infra.yml",
              "docker-compose.spark.yml",
          ):
              data = yaml.safe_load(Path(name).read_text())
              services = data.get("services") or {}
              if not services:
                  raise SystemExit(f"{name} has no services")
              print(f"{name}: {', '.join(sorted(services))}")
          PY
      - name: Lint
        run: ruff check src/
      - name: Test
        run: python -m pytest tests/ -q --tb=line --timeout=60

  publish:
    needs: [check, test]
    if: needs.check.outputs.exists == 'false' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard
        run: cd dashboard && npm ci && npm run build
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify dashboard is packaged
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("sandcastle_ai-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          if "sandcastle/dashboard/index.html" not in names:
              raise SystemExit("wheel is missing sandcastle/dashboard/index.html")
          print(f"dashboard packaged in {wheels[0].name}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
