name: Hub Template Validation

on:
  pull_request:
    paths:
      - "hub/**"
      - "site/hub/**"
      - "scripts/build_registry.py"
      - "scripts/update_hub_registry.py"
      - ".github/workflows/hub-validate.yml"
      - "src/sandcastle/templates/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate registry and scan templates
        run: |
          python - <<'SCRIPT'
          import hashlib
          import json
          import sys
          from pathlib import Path

          import jsonschema
          import yaml

          # --- Add src to path so we can import hub_scanner ---
          sys.path.insert(0, "src")
          from sandcastle.engine.hub_scanner import compute_sha256, scan_template

          errors = []

          # 1. Load and validate schema
          schema_path = Path("hub/schema/template.schema.json")
          schema = json.loads(schema_path.read_text())

          # 2. Load both runtime and generated-site registries.
          registry_paths = [Path("hub/registry.json"), Path("site/hub/registry.json")]
          template_count = 0
          prefix = "https://raw.githubusercontent.com/gizmax/Sandcastle/main/"
          repository_root = Path.cwd().resolve()

          # 3. Validate metadata, hashes, and raw-GitHub paths for every registry.
          for registry_path in registry_paths:
              registry = json.loads(registry_path.read_text())
              template_count += len(registry.get("templates", []))
              for i, tmpl in enumerate(registry.get("templates", [])):
                  slug = tmpl.get("slug", f"index-{i}")
                  label = f"{registry_path}:{slug}"
                  try:
                      jsonschema.validate(tmpl, schema)
                  except jsonschema.ValidationError as e:
                      errors.append(f"[{label}] Schema validation: {e.message}")

                  sha = tmpl.get("sha256")
                  dl_url = tmpl.get("download_url", "")
                  if not dl_url.startswith(prefix):
                      errors.append(f"[{label}] download_url must target this repository")
                      continue
                  local_path = (repository_root / dl_url[len(prefix):]).resolve()
                  if not local_path.is_relative_to(repository_root) or not local_path.is_file():
                      errors.append(f"[{label}] download_url target does not exist in the repository")
                      continue
                  actual = compute_sha256(local_path.read_text(encoding="utf-8"))
                  if not sha:
                      errors.append(f"[{label}] Missing sha256")
                  elif sha != actual:
                      errors.append(
                          f"[{label}] Checksum mismatch: registry={sha[:16]}... actual={actual[:16]}..."
                      )

          # 5. Scan all template YAML files for security issues
          template_dirs = [
              Path("src/sandcastle/templates"),
              Path("hub/community"),
          ]
          for tdir in template_dirs:
              if not tdir.exists():
                  continue
              for yaml_file in sorted(tdir.rglob("*.yaml")):
                  content = yaml_file.read_text(encoding="utf-8")
                  result = scan_template(content)
                  for err in result.errors:
                      step_info = f" (step: {err.step})" if err.step else ""
                      errors.append(f"[{yaml_file}] {err.code}: {err.message}{step_info}")

          # Report
          if errors:
              print(f"::error::Found {len(errors)} validation error(s):")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print(f"All {template_count} registry entries validated successfully.")
          SCRIPT

      - name: Verify site registry is generated from canonical registry
        run: python scripts/update_hub_registry.py --check
