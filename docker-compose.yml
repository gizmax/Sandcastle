name: sandcastle

x-sandcastle-build: &sandcastle-build
  image: sandcastle-ai:local
  build: .

x-sandcastle-env: &sandcastle-env
  env_file:
    - .env
  environment: &sandcastle-environment
    DATABASE_URL: postgresql+asyncpg://sandcastle:sandcastle@postgres:5432/sandcastle
    REDIS_URL: redis://redis:6379/0
    AUTH_REQUIRED: "true"
    API_KEY_PEPPER: "${API_KEY_PEPPER:?Set API_KEY_PEPPER in .env, for example: openssl rand -hex 32}"
    STORAGE_BACKEND: local
    DATA_DIR: /app/data
    WORKFLOWS_DIR: /app/workflows
    LOG_LEVEL: info
    DASHBOARD_ORIGIN: "http://localhost:8080"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandcastle
      POSTGRES_PASSWORD: sandcastle
      POSTGRES_DB: sandcastle
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandcastle"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible within the Docker network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible within the Docker network

  migrate:
    <<: [*sandcastle-build, *sandcastle-env]
    restart: "no"
    command: ["python", "-m", "sandcastle", "db", "migrate"]
    environment:
      <<: *sandcastle-environment
      ADMIN_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy

  sandcastle:
    <<: [*sandcastle-build, *sandcastle-env]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *sandcastle-environment
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env, for example: sc_<random-secret>}"
      SCHEDULER_ENABLED: "false"
    volumes:
      - app_data:/app/data

  scheduler:
    <<: [*sandcastle-build, *sandcastle-env]
    restart: unless-stopped
    # Keep port 8080 so the image HEALTHCHECK probes the process this service starts.
    command: ["python", "-m", "sandcastle", "serve", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *sandcastle-environment
      ADMIN_API_KEY: ""
      SCHEDULER_ENABLED: "true"
    volumes:
      - app_data:/app/data

  worker:
    <<: [*sandcastle-build, *sandcastle-env]
    restart: unless-stopped
    command: ["arq", "sandcastle.queue.worker.WorkerSettings"]
    # The arq worker serves no HTTP, so the image HEALTHCHECK can never pass.
    healthcheck:
      test: ["CMD-SHELL", "grep -aq arq /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *sandcastle-environment
      ADMIN_API_KEY: ""
    volumes:
      - app_data:/app/data

volumes:
  pg_data:
  redis_data:
  app_data:
