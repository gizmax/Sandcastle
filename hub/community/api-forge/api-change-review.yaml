name: "API Change Review"
description: "Translate an API change into compatibility risks, migration notes, and review questions."
version: "1.0.0"
default_model: sonnet

input_schema:
  required:
    - request
  properties:
    request:
      type: string
      description: "The source context to use for this api change review for engineering."
    audience:
      type: string
      description: "Who will use the resulting deliverable."
      default: "internal team"

steps:
  - id: assess-request
    type: llm
    model: sonnet
    prompt: |
      Assess the request and identify the evidence, constraints, and decisions needed for api change review for engineering.

      Request: {input.request}
      Intended audience: {input.audience}

      Return a structured working brief that is precise about unknowns and avoids inventing facts.

  - id: prepare-deliverable
    type: llm
    model: haiku
    depends_on:
      - assess-request
    prompt: |
      Turn this working brief into a practical api change review deliverable.

      Working brief: {steps.assess-request.output}

      Use concise headings, clear ownership where relevant, and explicit follow-up questions.
