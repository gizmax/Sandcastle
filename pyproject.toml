[project]
name = "sandcastle-ai"
dynamic = ["version"]
description = "You write YAML. Sandcastle ships AI to production. Any model, any provider, zero lock-in."
requires-python = ">=3.12"
license = {text = "BSL-1.1"}
readme = "README.md"
authors = [
    { name = "Tomas Pflanzer", email = "tom@pflanzer.cz" },
]
keywords = ["ai", "agents", "workflow", "orchestrator", "e2b", "llm", "pipeline", "workflow-templates"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "httpx-sse>=0.4",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aioboto3>=13",
    "python-dotenv>=1.0",
    "simpleeval>=1.0",
    "e2b>=1.0",
    "fpdf2>=2.8",
    "matplotlib>=3.8",
    "packaging>=21.0",
]

[project.optional-dependencies]
memory = [
    "mem0ai>=0.1.0",
    "fastembed>=0.3.6,<0.4",
    "anthropic>=0.95",
]
parse = [
    "pymupdf>=1.26",
    "python-docx>=1.0",
    "openpyxl>=3.1",
]
ocr = [
    "chandra-ocr>=2.0",
]
report = [
    "weasyprint>=68",
    "jinja2>=3.1",
    "markdown>=3.5",
    "matplotlib>=3.8",
]
docker = [
    "aiodocker>=0.22",
]
mcp = [
    "mcp>=1.23",
]
security = [
    "cryptography>=43.0",
]
telemetry = [
    "sentry-sdk[fastapi]>=2.0",
]
otel = [
    "opentelemetry-api>=1.40",
    "opentelemetry-sdk>=1.40",
    "opentelemetry-exporter-otlp-proto-http>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "aiodocker>=0.22",
    "mcp>=1.23",
    "sentry-sdk[fastapi]>=2.0",
    "cryptography>=43.0",
]

[project.urls]
Homepage = "https://sandcastle-ai.eu"
Repository = "https://github.com/gizmax/Sandcastle"
Documentation = "https://github.com/gizmax/Sandcastle/blob/main/README.md"
Issues = "https://github.com/gizmax/Sandcastle/issues"
"Live Demo" = "https://gizmax.github.io/Sandcastle/"
Changelog = "https://github.com/gizmax/Sandcastle/blob/main/CHANGELOG.md"
Dashboard = "https://gizmax.github.io/Sandcastle/"

[project.scripts]
sandcastle = "sandcastle.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sandcastle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sandcastle"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard/dist" = "sandcastle/dashboard"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
