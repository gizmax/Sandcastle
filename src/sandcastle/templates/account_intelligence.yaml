# name: Account Intelligence Engine
# description: Profile target accounts, enrich with firmographic and technographic data in parallel, detect buying signals, and generate personalized outreach
# tags: [Sales, ABM, Intelligence, CRM]
# category: sales_crm

name: account-intelligence
description: Profile target accounts, enrich with firmographic and technographic data in parallel, detect buying signals, and generate personalized outreach

default_model: sonnet
default_max_turns: 10
default_timeout: 300
default_tools: [salesforce, hubspot]

input_schema:
  required: ["target_accounts", "product_description"]
  properties:
    target_accounts:
      type: string
      description: "Comma-separated list of target account names to research (e.g. 'Acme Corp, Globex Inc, Initech')"
    product_description:
      type: string
      description: "Brief description of your product/service and its core value proposition"
    icp_criteria:
      type: string
      description: "Ideal Customer Profile criteria for scoring fit (e.g. 'B2B SaaS, 200-2000 employees, Series B+, using Kubernetes')"

steps:
  - id: target-profiling
    prompt: |
      Build a comprehensive profile for each target account in the list.

      Target accounts: {input.target_accounts}
      Product context: {input.product_description}
      ICP criteria: {input.icp_criteria}

      For each account, gather and organize the following baseline intelligence:
      1. Company overview - what they do, founding year, headquarters, employee count
      2. Leadership team - CEO, CTO, VP Sales, and other key decision makers with titles
      3. Business model - how they generate revenue, pricing approach, customer segments
      4. Recent news - funding rounds, acquisitions, partnerships, product launches in the last 6 months
      5. Market position - key competitors, estimated market share, growth trajectory
      6. Known pain points - public reviews, job postings that hint at challenges, analyst reports

      Use the Salesforce tool to check if any of these accounts already exist in the CRM:
        node /home/user/tools/salesforce.mjs search_accounts '{input.target_accounts}'

      Return structured JSON with each account as a top-level object containing all
      gathered intelligence fields. Flag accounts that already exist in the CRM with
      their current stage and owner.
    model: sonnet
    max_turns: 10

  - id: firmographic-enrichment
    depends_on: [target-profiling]
    prompt: |
      Enrich each target account with detailed firmographic data.

      Account profiles: {steps.target-profiling.output}
      ICP criteria: {input.icp_criteria}

      For each account, research and compile the following firmographic attributes:
      1. Company size - exact employee count, headcount growth trend (last 12 months)
      2. Revenue estimates - ARR or annual revenue, revenue growth rate
      3. Funding history - total raised, last round size, investors, valuation if available
      4. Office locations - HQ and satellite offices, geographic footprint
      5. Organizational structure - number of departments, engineering team size, sales team size
      6. Industry classification - primary NAICS/SIC code, sub-industry vertical
      7. Ownership type - private, public (ticker symbol), PE-backed, bootstrapped

      Score each account's firmographic fit against the ICP criteria on a scale of 1-100.
      Explain which specific firmographic attributes match or miss the ICP.

      Return enriched data as JSON with a firmographic_score and fit_analysis for each account.
    model: haiku
    max_turns: 8

  - id: technographic-profiling
    depends_on: [target-profiling]
    prompt: |
      Build a detailed technology profile for each target account.

      Account profiles: {steps.target-profiling.output}
      Our product: {input.product_description}

      For each account, identify their current technology stack across these layers:
      1. Infrastructure - cloud provider (AWS/GCP/Azure), containerization, CI/CD tools
      2. Data stack - databases, data warehouses, ETL/ELT tools, BI platforms
      3. Application layer - frontend frameworks, backend languages, API gateways
      4. DevOps/Security - monitoring, logging, SIEM, identity providers
      5. Business tools - CRM, marketing automation, support ticketing, project management
      6. AI/ML tools - any existing AI/ML platforms, LLM integrations, automation tools

      For each identified technology:
      - Confidence level (confirmed vs inferred from job postings/tech blogs)
      - How long they have likely been using it
      - Whether it competes with, complements, or could integrate with our product

      Highlight technology gaps where our product would fill a clear need.
      Return structured JSON with technology_stack, integration_opportunities, and
      competitive_overlaps for each account.
    model: haiku
    max_turns: 8

  - id: buying-signals
    depends_on: [target-profiling]
    prompt: |
      Detect and score active buying signals for each target account.

      Account profiles: {steps.target-profiling.output}
      Product context: {input.product_description}

      Analyze each account for the following buying signal categories:

      **Organizational Signals (0-25 points):**
      - New leadership hires (CTO, VP Engineering, Head of Data)
      - Departmental restructuring or new team formation
      - Strategic initiative announcements related to our product area

      **Financial Signals (0-25 points):**
      - Recent funding round (especially earmarked for tech/growth)
      - Budget cycle timing (fiscal year start, Q1 planning)
      - Public statements about technology investment priorities

      **Behavioral Signals (0-25 points):**
      - Job postings mentioning technologies related to our product
      - Blog posts or conference talks about problems we solve
      - Engagement with competitor content or attending relevant events

      **Timing Signals (0-25 points):**
      - Contract renewals with competitors approaching
      - Seasonal business patterns creating urgency
      - Regulatory deadlines requiring new capabilities

      Calculate a composite buying signal score (0-100) for each account.
      Classify as Hot (70+), Warm (40-69), or Cold (0-39).
      Return JSON with signal_score, classification, top_3_signals, and recommended_timing.
    model: haiku
    max_turns: 8

  - id: personalized-outreach
    depends_on: [firmographic-enrichment, technographic-profiling, buying-signals]
    prompt: |
      Generate highly personalized outreach strategies and messaging for each target account.

      Firmographic data: {steps.firmographic-enrichment.output}
      Technographic data: {steps.technographic-profiling.output}
      Buying signals: {steps.buying-signals.output}
      Product description: {input.product_description}

      For each account, create a multi-touch outreach plan:

      1. **Target Persona** - Identify the best person to contact first (role, likely priorities)
      2. **Opening Hook** - A personalized first line that references a specific finding
         (a recent news event, a tech stack gap, or a buying signal)
      3. **Value Proposition** - Tailor the product pitch to their specific pain points
         and technology environment. Reference concrete integration opportunities.
      4. **Email Sequence** (3 emails):
         - Email 1: Cold outreach (subject line + 4-5 sentence body)
         - Email 2: Follow-up with case study angle relevant to their industry
         - Email 3: Break-up email with a compelling data point or insight
      5. **LinkedIn Message** - A brief, casual connection request message
      6. **Talk Track** - 3-4 key talking points for a discovery call

      Rank accounts by outreach priority based on combined firmographic fit,
      technographic alignment, and buying signal strength.
      Return the complete outreach plan as structured JSON.
    model: sonnet
    max_turns: 10

  - id: crm-update
    depends_on: [personalized-outreach]
    prompt: |
      Update the CRM with all gathered intelligence and outreach plans.

      Outreach plans: {steps.personalized-outreach.output}
      Firmographic data: {steps.firmographic-enrichment.output}
      Buying signals: {steps.buying-signals.output}

      For each target account, use the Salesforce and HubSpot tools to:

      1. **Create or update the account record** in Salesforce:
         node /home/user/tools/salesforce.mjs upsert_account '<account_name>' '<data>'
         - Set firmographic fields (employee count, revenue, industry)
         - Add a note with the technology stack summary
         - Set the buying signal score as a custom field
         - Assign the appropriate owner based on territory/segment

      2. **Create contact records** in HubSpot for identified decision makers:
         node /home/user/tools/hubspot.mjs create_contact '<email>' '<data>'
         - Link contacts to the company record
         - Add the personalized outreach notes to each contact

      3. **Create outreach sequences** in HubSpot:
         node /home/user/tools/hubspot.mjs create_sequence '<account>' '<emails>'
         - Enroll the primary contact in the email sequence
         - Set appropriate send delays between emails

      Report the total number of accounts created/updated, contacts added,
      and sequences activated. Flag any accounts that failed to sync.
    model: haiku
    max_turns: 15
    tools: [salesforce, hubspot]
