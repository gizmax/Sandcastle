# name: Market Opportunity Scout
# description: Research market landscape, mine competitor gaps, size the TAM, and produce an actionable opportunity report
# tags: [Market-Research, TAM, Strategy, Competitive-Intel]
# category: marketing

name: market-opportunity-scout
description: Research market landscape, mine competitor gaps, size the TAM, and produce an actionable opportunity report

default_model: sonnet
default_max_turns: 10
default_timeout: 300

input_schema:
  required: ["product_description", "target_industry"]
  properties:
    product_description:
      type: string
      description: "Description of the product or service to evaluate market opportunities for"
    target_industry:
      type: string
      description: "Industry vertical to analyze (e.g. 'HealthTech', 'FinTech', 'EdTech')"
    geography:
      type: string
      description: "Geographic scope for the analysis (default: Global)"
      default: "Global"

steps:
  - id: define-market
    prompt: |
      Define the market boundaries and segmentation for this opportunity analysis.

      Product: {input.product_description}
      Target industry: {input.target_industry}
      Geography: {input.geography}

      Perform the following:
      1. Define the primary market category and adjacent categories this product could compete in
      2. Identify 3-5 market segments within the target industry based on company size,
         use case, buyer persona, and maturity level
      3. Map the value chain - who are the buyers, users, influencers, and decision makers
      4. Define the competitive landscape boundaries - which existing solution categories
         does this product overlap with or replace
      5. List key industry trends, tailwinds, and headwinds that affect market timing
      6. Identify regulatory or compliance considerations specific to the geography

      Structure the output as a market definition framework that downstream analysis
      steps can reference for consistent scoping.
    model: sonnet
    max_turns: 10

  - id: competitor-discovery
    depends_on: [define-market]
    prompt: |
      Discover and profile all significant competitors operating in the defined market.

      Market definition: {steps.define-market.output}
      Product: {input.product_description}

      For each competitor identified:
      1. Company name, founding year, headquarters, funding status, and estimated revenue
      2. Core product offering and how it overlaps with our product description
      3. Target customer segments and average deal size (if estimable)
      4. Key differentiators and unique selling propositions
      5. Pricing model (freemium, subscription, usage-based, enterprise)
      6. Known customers or case studies
      7. Recent strategic moves (partnerships, acquisitions, new features, pivots)

      Organize competitors into tiers:
      - Direct competitors (same problem, same buyer)
      - Indirect competitors (same problem, different approach)
      - Potential entrants (adjacent players who could expand)

      Return structured JSON with competitor profiles.
    model: haiku
    max_turns: 10

  - id: review-mining
    depends_on: [define-market]
    prompt: |
      Mine customer reviews and feedback for existing solutions in this market to
      identify pain points and satisfaction drivers.

      Market definition: {steps.define-market.output}
      Product category: {input.product_description}

      Research and synthesize feedback from sources such as G2, Capterra, TrustRadius,
      Reddit, Hacker News, and industry forums. Focus on:

      1. Most frequently mentioned pain points with existing solutions (rank by frequency)
      2. Features customers love and would not switch away from
      3. Features customers consistently request but no vendor provides
      4. Pricing complaints - what feels too expensive, what feels fair
      5. Onboarding and implementation friction points
      6. Support quality perceptions across vendors
      7. Switching triggers - what events cause customers to evaluate alternatives

      Quantify where possible (e.g., "43% of negative reviews mention slow onboarding").
      Extract 10-15 verbatim quotes that best represent the voice of the customer.
    model: haiku
    max_turns: 10

  - id: industry-research
    depends_on: [define-market]
    prompt: |
      Research industry dynamics, growth drivers, and macro trends affecting this market.

      Market definition: {steps.define-market.output}
      Target industry: {input.target_industry}
      Geography: {input.geography}

      Investigate and report on:
      1. Industry growth rate (historical 3-year and projected 3-year CAGR)
      2. Key market drivers - what is fueling demand (regulation, digital transformation,
         cost pressure, new buyer segments)
      3. Technology trends reshaping the industry (AI adoption, automation, cloud migration)
      4. Funding and M&A activity - recent deals, acquirers, valuations
      5. Analyst reports and market forecasts from firms like Gartner, Forrester, IDC
      6. Industry events, conferences, and thought leadership channels
      7. Emerging business models or go-to-market strategies gaining traction
      8. Geographic variations - which regions are leading adoption vs lagging

      Provide specific data points and cite sources where possible.
      Structure as an industry landscape brief.
    model: haiku
    max_turns: 10

  - id: gap-analysis
    depends_on: [competitor-discovery, review-mining, industry-research]
    prompt: |
      Synthesize the competitor profiles, customer feedback, and industry research
      into a comprehensive gap analysis.

      Competitor profiles: {steps.competitor-discovery.output}
      Customer review insights: {steps.review-mining.output}
      Industry research: {steps.industry-research.output}
      Our product: {input.product_description}

      Identify and rank:
      1. **Unserved segments** - customer groups with needs that no current solution
         adequately addresses. Estimate segment size and willingness to pay.
      2. **Underserved use cases** - jobs-to-be-done where existing solutions are
         mediocre. Map each to specific customer complaints from the review mining.
      3. **Feature whitespace** - capabilities no competitor offers that customers
         actively request. Cross-reference review mining with competitor feature sets.
      4. **Pricing gaps** - segments priced out of existing solutions or overpaying
         for features they do not use.
      5. **Experience gaps** - areas where the buying, onboarding, or support experience
         is consistently poor across the market.
      6. **Positioning gaps** - messaging angles or brand positions no competitor owns.

      For each gap, assess: severity (1-10), our product's ability to address it (1-10),
      and estimated effort to capture it (Low/Medium/High).
    model: sonnet
    max_turns: 10

  - id: tam-calculation
    depends_on: [gap-analysis, industry-research]
    prompt: |
      Calculate the Total Addressable Market (TAM), Serviceable Addressable Market (SAM),
      and Serviceable Obtainable Market (SOM) for this opportunity.

      Gap analysis: {steps.gap-analysis.output}
      Industry research: {steps.industry-research.output}
      Product: {input.product_description}
      Geography: {input.geography}

      Use both top-down and bottom-up approaches:

      **Top-Down:**
      1. Start with total industry spend in the relevant category
      2. Apply filters for geography, segment, and use case relevance
      3. Account for pricing model differences vs existing solutions

      **Bottom-Up:**
      1. Estimate the number of potential customer organizations by segment
      2. Apply average contract value assumptions per segment
      3. Factor in adoption curves and market penetration rates

      **Market sizing output:**
      - TAM: Total revenue opportunity if 100% market share (realistic bounds)
      - SAM: Addressable portion given our product scope, geography, and go-to-market
      - SOM: Realistic capture in Years 1-3 given competitive dynamics and ramp
      - Growth trajectory: projected market CAGR and our expected growth vs market

      Show all assumptions explicitly. Provide low, medium, and high scenarios.
      Express all figures in USD with clear units (millions/billions).
    model: sonnet
    max_turns: 10

  - id: opportunity-report
    depends_on: [gap-analysis, tam-calculation]
    prompt: |
      Compile the complete market opportunity analysis into an executive-ready report.

      Gap analysis: {steps.gap-analysis.output}
      Market sizing: {steps.tam-calculation.output}
      Product: {input.product_description}
      Industry: {input.target_industry}
      Geography: {input.geography}

      Structure the report as follows:

      **1. Executive Summary** (1 paragraph)
      - Key opportunity, market size, and recommended action

      **2. Market Opportunity Score** (1-100)
      - Composite score weighing market size, growth, competitive intensity,
        timing, and product-market fit. Explain the scoring.

      **3. Top 3 Opportunities** (ranked)
      - For each: description, target segment, estimated revenue potential,
        time to capture, competitive moat potential, and key risks

      **4. Go-to-Market Recommendations**
      - Recommended initial target segment and why
      - Pricing strategy suggestion based on gap analysis
      - Key messaging pillars based on unmet needs
      - Channel strategy (direct, PLG, partnerships)

      **5. Risks and Mitigations**
      - Top 5 risks with severity and mitigation strategies

      **6. Next Steps**
      - Concrete 90-day action plan to validate and capture the opportunity

      Write in clear, decisive language suitable for a strategy presentation.
    model: sonnet
    max_turns: 10
