# name: Lead Scoring
# description: Fetch leads from Salesforce, enrich with research data, score, and update CRM
# tags: [Sales, Salesforce, Lead-Gen, Scoring]
# category: sales_crm

name: lead-scoring
description: Fetch leads from Salesforce, enrich with research data, score, and update CRM

default_model: sonnet
default_max_turns: 10
default_timeout: 300
default_tools: [salesforce]

input_schema:
  required: ["lead_source"]
  properties:
    lead_source:
      type: string
      description: "Salesforce lead source filter (e.g. 'Web', 'Event', 'Referral')"
    min_company_size:
      type: number
      description: "Minimum company size to qualify (number of employees, default: 10)"
      default: 10

steps:
  - id: fetch-leads
    prompt: |
      Query Salesforce for recent leads matching source: {input.lead_source}

      Use the Salesforce tool:
        node /home/user/tools/salesforce.mjs query_leads '{input.lead_source}' 30

      Return the list of leads with name, company, title, email, and creation date.
    model: haiku
    max_turns: 5

  - id: enrich-data
    depends_on: [fetch-leads]
    prompt: |
      Research and enrich these leads with additional company data:

      Leads: {steps.fetch-leads.output}
      Minimum company size filter: {input.min_company_size} employees

      For each lead, research:
      1. Company size (employees) and revenue estimate
      2. Industry and sub-industry
      3. Recent funding or growth signals
      4. Technology stack (if available)
      5. Any relevant news in the past 90 days

      Filter out companies below the minimum size threshold.
      Return enriched data as structured JSON.
    model: sonnet
    max_turns: 10

  - id: score-leads
    depends_on: [enrich-data]
    prompt: |
      Score each enriched lead on a 1-100 scale:

      Enriched leads: {steps.enrich-data.output}

      Scoring criteria:
      - Company fit (size, industry, tech stack): 0-30 points
      - Role relevance (decision maker, influencer, end user): 0-25 points
      - Timing signals (funding, growth, hiring): 0-25 points
      - Engagement potential (reachability, mutual connections): 0-20 points

      Classify as:
      - Hot (80-100): Immediate outreach
      - Warm (50-79): Nurture sequence
      - Cold (0-49): Monitor only

      Return JSON array: lead_name, company, score, classification, score_breakdown, recommended_action.
    model: sonnet
    max_turns: 8

  - id: update-crm
    depends_on: [score-leads]
    prompt: |
      Update the Salesforce lead records with scoring results:

      Scored leads: {steps.score-leads.output}

      For each lead, use the Salesforce tool to update the record:
        node /home/user/tools/salesforce.mjs update_lead '<lead_id>' '<score>' '<classification>'

      Set the lead score field, add a note with the scoring breakdown,
      and move Hot leads to the "Qualified" status.

      Report the update results for each lead.
    model: haiku
    max_turns: 15
