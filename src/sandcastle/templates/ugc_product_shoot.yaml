# name: UGC Creative Studio
# description: AI-powered creative studio that transforms a single product photo into a complete, platform-ready UGC content package with quality control, self-healing, and brand memory
# tags: [Marketing, UGC, Product-Photography, Social-Media, E-Commerce, AI-Studio, Brand-Memory]
# category: creative

name: ugc-product-shoot
description: >
  Full-pipeline AI creative studio. Drop in a product photo and get back a complete
  UGC content package - platform-optimized shots across multiple styles, AI quality
  scoring with automatic re-generation of failed images, human approval gate, and
  brand memory that learns from every run. Supports 3 budget tiers (full/standard/lean)
  with intelligent condition routing.
default_model: sonnet
default_max_turns: 5
default_timeout: 600
default_tools: []

memory:
  scope: agent
  agent: ugc-creative-studio
  auto_inject: true
  max_inject: 10
  max_age_days: 90
  enrich: true
  conflict_check: true

input_schema:
  required: ["product_name", "product_photo"]
  properties:
    product_name:
      type: string
      description: "Product name (e.g. 'Aesop Resurrection Hand Cream')"
      example: "Aesop Resurrection Hand Cream"
    product_photo:
      type: string
      format: file-path
      description: "Path to the product photo - Vision AI will auto-analyze everything"
      example: "/path/to/my-product.png"
    brand_name:
      type: string
      description: "Brand name for memory recall (e.g. 'Aesop')"
      default: ""
    brand_style:
      type: string
      description: "Optional brand aesthetic override (leave blank for AI to detect from photo)"
      default: ""
    target_platforms:
      type: string
      description: "Comma-separated platforms to generate for"
      default: "instagram-stories, instagram-feed, tiktok, pinterest"
    budget:
      type: string
      enum: ["full", "standard", "lean"]
      description: "Budget tier: full (12-18 shots, 4K, transparent product), standard (6-8 shots, 2K, transparent product), lean (3 shots, 1K, flash model)"
      default: "standard"
    style_variants:
      type: string
      description: "Comma-separated visual styles to generate"
      default: "minimalist, lifestyle, dramatic"
    target_audience:
      type: string
      description: "Target demographic"
      default: "young adults 20-35"

steps:
  # ============================================================
  # PHASE 1: INTELLIGENCE (parallel)
  # ============================================================

  - id: "vision-analyze"
    prompt: |
      You are a senior product photographer with 15 years of experience in e-commerce and UGC content.

      Analyze this product photo in detail: {input.product_photo}

      Extract EVERYTHING you can see:

      1. **Physical attributes**: exact shape, dimensions estimate, materials (glass, plastic, metal, ceramic), surface finish (matte, glossy, satin, frosted), weight impression
      2. **Colors**: extract 5-8 exact hex color codes visible on the product and packaging
      3. **Typography & labels**: any text, font style, label placement, logo design
      4. **Distinctive features**: cap/closure style, texture patterns, embossing, unique design elements
      5. **Brand aesthetic**: what design language does this product communicate (minimal, luxury, playful, clinical, artisan)
      6. **Lighting notes**: how light interacts with the surface (reflections, transparency, shadows it would cast)
      7. **Scale reference**: estimated size relative to a human hand
      8. **Photography challenges**: what would be tricky to photograph (reflective surfaces, transparent elements, small text)

      {% if input.brand_style %}
      Brand style override provided: {input.brand_style}
      {% endif %}

      Be extremely precise - the image generation models will use these descriptions to recreate the product.
    output_schema:
      type: object
      properties:
        product_description: { type: string }
        colors: { type: array, items: { type: object, properties: { hex: { type: string }, name: { type: string }, location: { type: string } } } }
        materials: { type: array, items: { type: string } }
        surface_finish: { type: string }
        typography: { type: string }
        distinctive_features: { type: array, items: { type: string } }
        brand_aesthetic: { type: string }
        lighting_notes: { type: string }
        scale: { type: string }
        photography_challenges: { type: array, items: { type: string } }
    retry:
      max_attempts: 2
      backoff: exponential
      on_failure: abort

  - id: "brand-memory-recall"
    model: haiku
    memory:
      read: true
    prompt: |
      You are a brand memory assistant. Check if we have any previous knowledge about this brand.

      Brand name: {input.brand_name}
      Product: {input.product_name}

      Search your memories for:
      1. Previous successful shoots for this brand - what styles/compositions worked best
      2. Brand color palettes we've used before
      3. Quality scores from past runs - what scored highest
      4. Any specific brand guidelines or preferences noted
      5. Platform performance data if available

      If no memories exist for this brand, return empty arrays and note this is a first-time brand.

      IMPORTANT: Be concise. Only return actionable information that will help the creative director.
    output_schema:
      type: object
      properties:
        brand_known: { type: boolean }
        previous_shoots: { type: integer }
        best_styles: { type: array, items: { type: string } }
        best_compositions: { type: array, items: { type: string } }
        brand_palette: { type: array, items: { type: string } }
        avg_quality_score: { type: number }
        platform_insights: { type: array, items: { type: string } }
        notes: { type: string }

  # ============================================================
  # PHASE 2: CREATIVE STRATEGY
  # ============================================================

  - id: "creative-director"
    depends_on: ["vision-analyze", "brand-memory-recall"]
    prompt: |
      You are an elite creative director running a UGC content studio. You have deep expertise in platform-native content that drives engagement.

      ## Product Intelligence
      {steps.vision-analyze.output}

      ## Brand Memory
      {steps.brand-memory-recall.output}

      ## Brief
      - Product: {input.product_name}
      - Brand: {input.brand_name}
      - Budget tier: {input.budget}
      - Target platforms: {input.target_platforms}
      - Style variants: {input.style_variants}
      - Target audience: {input.target_audience}

      ## Your Task
      Create a complete shoot plan. For each shot, define:
      - **shot_id**: unique identifier (e.g. "ig-story-minimalist-1")
      - **platform**: target platform
      - **aspect**: aspect ratio (9:16 for Stories/Reels/TikTok/Pinterest, 4:5 for Feed, 1:1 for Twitter)
      - **style**: visual style variant
      - **scene_description**: detailed scene/environment description
      - **model_description**: person description if applicable (age, appearance, outfit, pose) - always include "natural skin with realistic texture, visible pores" for realism
      - **product_placement**: exactly how the product appears in the shot
      - **props**: list of props in the scene
      - **lighting**: lighting setup description
      - **camera**: lens mm, aperture, focus point
      - **mood**: emotional tone
      - **caption_hook**: suggested social media caption hook (first line)

      ## Platform specs
      - Instagram Stories: 9:16, vertical, bold, swipe-up friendly
      - Instagram Feed: 4:5, editorial, scroll-stopping
      - TikTok: 9:16, authentic, trend-aware, raw energy
      - Pinterest: 2:3, aspirational, pin-worthy, detailed
      - Twitter/X: 16:9, clean, high-contrast

      ## Shot count by budget
      - **full**: 3-4 shots per platform x style combination (12-18 total)
      - **standard**: 2 shots per platform x style combination (6-8 total)
      - **lean**: 1 shot per platform, best style only (3 total)

      {% if input.budget == "full" %}
      Include shots for ALL requested platforms and ALL style variants.
      {% elif input.budget == "standard" %}
      Prioritize the top 2-3 platform/style combinations. Focus on highest-impact shots.
      {% else %}
      Pick the 3 highest-impact platform/shot combinations only. One per platform.
      {% endif %}

      ## Brand memory integration
      {% if steps.brand-memory-recall.output.brand_known %}
      This is a returning brand. Lean into styles that scored well previously: {steps.brand-memory-recall.output.best_styles}
      Avoid compositions that underperformed.
      {% else %}
      First-time brand - create a diverse mix to establish baseline data.
      {% endif %}

      Return a JSON object with a "shots" array containing all planned shots and a "strategy_notes" string with your overall creative rationale.
    output_schema:
      type: object
      properties:
        shots:
          type: array
          items:
            type: object
            properties:
              shot_id: { type: string }
              platform: { type: string }
              aspect: { type: string }
              style: { type: string }
              scene_description: { type: string }
              model_description: { type: string }
              product_placement: { type: string }
              props: { type: array, items: { type: string } }
              lighting: { type: string }
              camera: { type: string }
              mood: { type: string }
              caption_hook: { type: string }
        strategy_notes: { type: string }
    retry:
      max_attempts: 2
      backoff: exponential
      on_failure: abort

  # ============================================================
  # PHASE 3: GENERATION (condition-branched)
  # ============================================================

  - id: "budget-router"
    depends_on: ["creative-director"]
    type: condition
    condition_config:
      expression: "'{input.budget}' == 'lean'"
      then: ["compose-lean-prompts"]
      else: ["compose-transparent-prompt"]

  # --- LEAN path: LLM composes prompt, then direct Imagen API call ---
  - id: "compose-lean-prompts"
    depends_on: ["budget-router"]
    type: llm
    parallel_over: "steps.creative-director.output.shots"
    prompt: |
      You are an expert AI image prompt engineer for Imagen 4.0.

      Compose a single dense image generation prompt for this UGC product shot:
      - Product: {input.product_name}
      - Scene: {input._item.scene_description}
      - Product placement: {input._item.product_placement}
      - Model/person: {input._item.model_description}
      - Lighting: {input._item.lighting}
      - Camera: {input._item.camera}
      - Mood: {input._item.mood}
      - Props: {input._item.props}

      Requirements:
      - Single paragraph, 80-150 words, extremely detailed
      - Focus on photorealism, natural skin texture, authentic UGC feel
      - Include exact product description from analysis: {steps.vision-analyze.output.product_description}
      - Specify camera lens, depth of field, color grading
      - Do NOT mention "AI generated" or "Imagen"

      Return a JSON object:
      {
        "shot_id": "{input._item.shot_id}",
        "prompt": "your composed image generation prompt",
        "aspect_ratio": "{input._item.aspect}"
      }
    output_schema:
      type: object
      properties:
        shot_id: { type: string }
        prompt: { type: string }
        aspect_ratio: { type: string }

  - id: "generate-lean"
    depends_on: ["compose-lean-prompts"]
    type: http
    parallel_over: "steps.compose-lean-prompts.output"
    http_config:
      method: POST
      url: "https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-fast-generate-001:predict?key={env.GEMINI_API_KEY}"
      headers:
        Content-Type: "application/json"
      body:
        instances:
          - prompt: "{input._item.prompt}"
        parameters:
          sampleCount: 1
          aspectRatio: "{input._item.aspect_ratio}"
    retry:
      max_attempts: 2
      backoff: exponential
      on_failure: skip

  # --- STANDARD/FULL path: transparent product cut + scene composites ---
  - id: "compose-transparent-prompt"
    depends_on: ["budget-router"]
    type: llm
    prompt: |
      You are an expert AI image prompt engineer for Imagen 4.0.

      Compose a prompt for a clean, studio-quality product-only shot on a plain white background.
      The product must be perfectly isolated with no background elements, props, or people.

      Product details:
      - Name: {input.product_name}
      - Description: {steps.vision-analyze.output.product_description}
      - Key features: {steps.vision-analyze.output.distinctive_features}
      - Materials: {steps.vision-analyze.output.materials}
      - Colors: {steps.vision-analyze.output.colors}

      Requirements:
      - Single paragraph, 60-100 words
      - Studio lighting, perfectly sharp, centered composition
      - Pure white background, no shadows, no reflections on background
      - Every physical detail must be accurate

      Return a JSON object:
      {
        "prompt": "your composed product isolation prompt"
      }
    output_schema:
      type: object
      properties:
        prompt: { type: string }

  - id: "generate-transparent-product"
    depends_on: ["compose-transparent-prompt"]
    type: http
    http_config:
      method: POST
      url: "https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key={env.GEMINI_API_KEY}"
      headers:
        Content-Type: "application/json"
      body:
        instances:
          - prompt: "{steps.compose-transparent-prompt.output.prompt}"
        parameters:
          sampleCount: 1
          aspectRatio: "1:1"
    retry:
      max_attempts: 3
      backoff: exponential
      on_failure: abort

  - id: "compose-scene-prompts"
    depends_on: ["generate-transparent-product"]
    type: llm
    parallel_over: "steps.creative-director.output.shots"
    prompt: |
      You are an expert AI image prompt engineer for Imagen 4.0.

      Compose a single dense image generation prompt for this UGC product scene:
      - Product: {input.product_name}
      - Shot ID: {input._item.shot_id}
      - Platform: {input._item.platform}
      - Style: {input._item.style}
      - Scene: {input._item.scene_description}
      - Product placement: {input._item.product_placement}
      - Model/person: {input._item.model_description}
      - Lighting: {input._item.lighting}
      - Camera: {input._item.camera}
      - Mood: {input._item.mood}
      - Props: {input._item.props}

      Product details from analysis: {steps.vision-analyze.output.product_description}

      Requirements:
      - Single paragraph, 100-180 words, extremely detailed
      - Focus on photorealism, natural skin texture, authentic UGC feel
      - The product must be clearly visible and match its real appearance exactly
      - Specify camera lens, depth of field, color grading, time of day
      - Do NOT mention "AI generated" or "Imagen"

      Return a JSON object:
      {
        "shot_id": "{input._item.shot_id}",
        "prompt": "your composed image generation prompt",
        "aspect_ratio": "{input._item.aspect}"
      }
    output_schema:
      type: object
      properties:
        shot_id: { type: string }
        prompt: { type: string }
        aspect_ratio: { type: string }

  - id: "generate-scenes"
    depends_on: ["compose-scene-prompts"]
    type: http
    parallel_over: "steps.compose-scene-prompts.output"
    http_config:
      method: POST
      url: "https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key={env.GEMINI_API_KEY}"
      headers:
        Content-Type: "application/json"
      body:
        instances:
          - prompt: "{input._item.prompt}"
        parameters:
          sampleCount: 1
          aspectRatio: "{input._item.aspect_ratio}"
    retry:
      max_attempts: 2
      backoff: exponential
      on_failure: skip

  # ============================================================
  # PHASE 4: QUALITY + SELF-HEALING
  # ============================================================

  - id: "quality-judge"
    depends_on: ["generate-lean", "generate-scenes"]
    prompt: |
      You are a senior art director and quality control specialist for UGC product photography.

      ## Original product reference
      Reference photo: {input.product_photo}
      Product analysis: {steps.vision-analyze.output}

      ## Creative brief
      Shoot plan: {steps.creative-director.output}

      ## Generated images (Imagen API responses)
      Lean results: {steps.generate-lean.output}
      Scene results: {steps.generate-scenes.output}

      ## Your Task
      Score EVERY generated image on 7 dimensions (1-10 each):

      1. **product_accuracy**: Does the product match the reference? Correct colors, shape, labels, proportions?
      2. **composition**: Rule of thirds, visual balance, focal point, negative space usage
      3. **lighting_quality**: Natural, consistent, matches the brief, no artifacts
      4. **authenticity**: Does it look like real UGC? Not overly polished, not AI-obvious
      5. **platform_fit**: Would this perform well on its target platform? Right vibe, aspect, energy
      6. **brand_coherence**: Does the style match the brand aesthetic? Color palette consistency
      7. **technical_quality**: Resolution, sharpness, no visible artifacts, correct aspect ratio

      For each image return:
      - shot_id
      - scores (all 7 dimensions)
      - overall_score (weighted average: product_accuracy 25%, authenticity 20%, composition 15%, lighting 15%, platform_fit 10%, brand_coherence 10%, technical_quality 5%)
      - pass (true if overall_score >= 6.5)
      - issues: array of specific problems found
      - fix_suggestions: array of prompt improvements if score < 6.5

      Also return aggregate stats: total images, passed, failed, average score.
    output_schema:
      type: object
      properties:
        images:
          type: array
          items:
            type: object
            properties:
              shot_id: { type: string }
              scores:
                type: object
                properties:
                  product_accuracy: { type: number }
                  composition: { type: number }
                  lighting_quality: { type: number }
                  authenticity: { type: number }
                  platform_fit: { type: number }
                  brand_coherence: { type: number }
                  technical_quality: { type: number }
              overall_score: { type: number }
              pass: { type: boolean }
              issues: { type: array, items: { type: string } }
              fix_suggestions: { type: array, items: { type: string } }
        total: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        avg_score: { type: number }

  - id: "quality-check"
    depends_on: ["quality-judge"]
    type: condition
    condition_config:
      expression: "{steps.quality-judge.output.failed} > 0"
      then: ["regenerate-failed"]
      else: []

  - id: "regenerate-failed"
    depends_on: ["quality-check"]
    type: llm
    prompt: |
      Some images failed quality control. For each failed image, compose an improved
      Imagen 4.0 prompt that addresses the quality judge's feedback.

      ## Failed images and fix suggestions
      {steps.quality-judge.output}

      ## Product reference
      Product analysis: {steps.vision-analyze.output}

      For each FAILED image (pass: false):
      1. Read the fix_suggestions from the quality judge
      2. Compose an improved prompt addressing every listed issue
      3. Make the prompt more specific about problematic areas

      Return a JSON object with an "improved_prompts" array, each containing:
      {
        "shot_id": "original shot ID",
        "prompt": "improved image generation prompt",
        "aspect_ratio": "original aspect ratio"
      }

      Note: These prompts will be sent to Imagen 4.0 API for regeneration.
    output_schema:
      type: object
      properties:
        improved_prompts:
          type: array
          items:
            type: object
            properties:
              shot_id: { type: string }
              prompt: { type: string }
              aspect_ratio: { type: string }
    retry:
      max_attempts: 2
      backoff: exponential
      on_failure: skip

  # ============================================================
  # PHASE 5: HUMAN APPROVAL
  # ============================================================

  - id: "creative-review"
    depends_on: ["quality-check"]
    type: approval
    approval_config:
      message: "Review your UGC Creative Studio output. Approve to finalize the delivery package, or edit to request changes."
      show_data: steps.quality-judge.output
      timeout_hours: 48
      on_timeout: abort
      allow_edit: true
    prompt: |
      Prepare a creative review package for the client.

      ## Product
      {input.product_name} by {input.brand_name}

      ## Quality Report
      {steps.quality-judge.output}

      ## Creative Strategy
      {steps.creative-director.output.strategy_notes}

      Present a clean summary showing:
      1. Each generated image with its shot type, platform, style, and quality score
      2. Overall quality metrics
      3. Recommended posting order
      4. Any images that were regenerated (and why)

  # ============================================================
  # PHASE 6: FINALIZE (parallel)
  # ============================================================

  - id: "final-deliverables"
    depends_on: ["creative-review"]
    prompt: |
      Compile the final UGC Creative Studio delivery package.

      ## Approved content
      Quality report: {steps.quality-judge.output}
      Creative strategy: {steps.creative-director.output}
      Product analysis: {steps.vision-analyze.output}

      ## Client info
      Product: {input.product_name}
      Brand: {input.brand_name}
      Platforms: {input.target_platforms}
      Budget tier: {input.budget}

      Create a comprehensive delivery document with:

      1. **Executive Summary**
         - Total images delivered
         - Average quality score
         - Budget tier and estimated cost
         - Platforms covered

      2. **Image Catalog**
         For each image:
         - File path
         - Shot type and style
         - Target platform and aspect ratio
         - Quality score and highlights
         - Recommended posting time (platform best practices)

      3. **Platform Strategy**
         For each platform:
         - Which images to use
         - Recommended posting sequence
         - Caption suggestions with hooks
         - Hashtag sets (10-15 per platform)
         - Best posting times

      4. **Content Calendar**
         - Suggested 2-week posting schedule
         - A/B testing suggestions (which images to test against each other)

      5. **Cost Breakdown**
         - Per-image generation cost
         - Transparent product cut cost (if applicable)
         - Regeneration costs (if applicable)
         - LLM analysis costs
         - Total

      Format as clean, professional markdown.

  - id: "brand-memory-save"
    depends_on: ["creative-review"]
    model: haiku
    memory:
      read: true
      write: true
    prompt: |
      Save learnings from this UGC Creative Studio run to brand memory.

      ## Run data
      - Brand: {input.brand_name}
      - Product: {input.product_name}
      - Budget: {input.budget}
      - Platforms: {input.target_platforms}
      - Styles: {input.style_variants}

      ## Quality results
      {steps.quality-judge.output}

      ## Creative strategy used
      {steps.creative-director.output.strategy_notes}

      ## What to remember
      Distill the key learnings into concise memory entries:
      1. Which styles scored highest for this brand
      2. Which platform/style combinations worked best
      3. Any quality issues that required regeneration (to avoid next time)
      4. The brand's color palette (confirmed from product analysis)
      5. Overall quality score for benchmarking future runs

      Write these as clear, actionable memories that will help the creative director
      make better decisions on future runs for this brand.

      Return a summary of what was saved to memory.
    output_schema:
      type: object
      properties:
        memories_saved: { type: integer }
        summary: { type: string }
        brand_profile:
          type: object
          properties:
            top_styles: { type: array, items: { type: string } }
            avg_quality: { type: number }
            runs_completed: { type: integer }

on_complete:
  storage_path: "ugc-shoots/{run_id}/deliverables.json"

on_failure:
  storage_path: "ugc-shoots/{run_id}/error-report.json"
