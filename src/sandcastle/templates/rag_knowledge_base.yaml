         collection_name: "{input.domain}-knowledge-base"
         embedding_dimension: [from embedding evaluation]
         distance_metric: cosine
         index_type: hnsw
         hnsw_config:
           m: 16
           ef_construction: 200
           ef_search: 128
         # Payload indexing for metadata filtering
         payload_indexes:
           - field: content_type
             type: keyword
           - field: domain_entities
             type: keyword
           - field: created_at
             type: datetime
