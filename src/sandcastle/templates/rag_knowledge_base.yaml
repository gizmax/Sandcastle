      4. **Monitoring and alerting configuration**:
         ```yaml
         metrics:
           - name: retrieval_latency_p95
             threshold: 500ms
             alert: warning
           - name: retrieval_latency_p99
             threshold: 1000ms
             alert: critical
           - name: average_relevance_score
             threshold: 0.6
