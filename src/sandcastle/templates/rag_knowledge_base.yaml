      2. **Ingestion pipeline configuration**:
         ```yaml
         preprocessing:
           normalize_unicode: true
           strip_html: true
           extract_metadata: true
         chunking:
           strategy: [from chunking strategy]
           target_size: [tokens]
           max_size: [tokens]
           overlap: [tokens or percentage]
           preserve_atomic: [code_blocks, tables, lists]
         embedding:
           model: [from embedding evaluation]
           batch_size: 100
           max_concurrent: 5
           retry_attempts: 3
           retry_backoff: exponential
         ```

      3. **Retrieval pipeline configuration**:
         ```yaml
         query_processing:
           expansion_enabled: true
           hyde_enabled: true
           hyde_model: haiku
           sub_query_decomposition: true
           max_sub_queries: 5
         retrieval:
           top_k_candidates: 50
           hybrid_search: true
           bm25_weight: 0.3
           vector_weight: 0.7
           rrf_k: 60
         reranking:
           enabled: true
           model: [from optimization]
           top_k_rerank: 30
           final_top_k: 5
         context_assembly:
           max_context_tokens: 4096
           include_neighbors: true
           mmr_lambda: 0.7
