         - Document update: detect changes -> re-chunk affected sections -> re-embed -> update index
         - Document removal: mark chunks as deleted -> remove from index -> cleanup
         - Bulk re-indexing: schedule during low-traffic window, blue-green deployment

      3. **Incident response procedures**:
