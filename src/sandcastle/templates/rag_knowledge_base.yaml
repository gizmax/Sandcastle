      Document analysis: {steps.document-analysis.output}
      Domain: {input.domain}
      Document sources: {input.document_sources}

      You are a senior MLOps engineer specializing in RAG system deployment. Your task
      is to produce a comprehensive, production-ready deployment configuration that
      covers infrastructure, monitoring, scaling, and operational procedures.

      --- INFRASTRUCTURE ARCHITECTURE ---

      1. **System architecture diagram** (text-based):
         - Document ingestion pipeline (sources -> preprocessor -> chunker -> embedder -> index)
         - Query pipeline (user query -> query processor -> retriever -> reranker -> assembler -> LLM)
         - Feedback loop (user signals -> metrics store -> retraining pipeline)
         - Storage layer (vector DB, metadata store, document store, cache)

      2. **Component specifications**:
         - Vector database: instance type, storage size, replica count
         - Embedding service: API-based vs self-hosted, GPU requirements if self-hosted
         - Reranker service: deployment mode, batch size, GPU requirements
         - Cache layer: Redis/Memcached configuration, eviction policy, TTL
         - API gateway: rate limiting, authentication, request routing
         - Queue system: for async document ingestion (Redis/RabbitMQ/SQS)

      3. **Scaling configuration**:
         - Horizontal scaling triggers (CPU > 70%, latency P95 > 500ms, queue depth > 100)
         - Auto-scaling rules for each component
         - Read replicas for vector database
         - Embedding service concurrency limits
         - Estimated resource requirements for the corpus size from document analysis

      --- DEPLOYMENT CONFIGURATION FILES ---

