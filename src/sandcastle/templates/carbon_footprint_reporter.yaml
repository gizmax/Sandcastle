      | Scope 1 (tCO2e) | | | | |
      | Scope 2 - Market (tCO2e) | | | | |
      | Scope 3 (tCO2e) | | | | |
      | Revenue Intensity (tCO2e/$M) | | | | |
      | Employee Intensity (tCO2e/FTE) | | | | |
      | Renewable Energy (%) | | | | |
      | SBTi Alignment Status | | | | |

      Emissions Profile:
