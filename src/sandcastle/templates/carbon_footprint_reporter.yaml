      "{input.organization_name} total greenhouse gas emissions for {input.reporting_year} were X tCO2e, representing a Y% change from the prior year/base year. This report provides a complete accounting across Scope 1 (direct), Scope 2 (energy), and Scope 3 (value chain) emissions."

