      | Medium-term | $X | $X | X | X% |
      | Long-term | $X | $X | X | X% |
      | **Total** | **$X** | **$X** | **X** | **X%** |

      **3. Regulatory Compliance Status**
      Traffic light dashboard for regulatory readiness:
      | Framework | Applicability | Readiness | Next Deadline | Action Required |
      |-----------|--------------|-----------|---------------|----------------|
      | GHG Protocol | | | | |
      | TCFD | | | | |
      | CSRD/ESRS | | | | |
      | SEC Climate | | | | |
      | CDP | | | | |
      | SBTi | | | | |

      **4. Risk and Opportunity Summary**
