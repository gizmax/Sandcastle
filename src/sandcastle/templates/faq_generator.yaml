# name: FAQ Generator
# description: Analyze resolved support tickets to auto-generate FAQ entries and publish to Notion
# tags: [Support, Zendesk, Notion, Knowledge-Base]
# category: support

name: faq-generator
description: Analyze resolved support tickets to auto-generate FAQ entries and publish to Notion

default_model: sonnet
default_max_turns: 10
default_timeout: 300
default_tools: [zendesk, notion]

input_schema:
  required: ["days_lookback"]
  properties:
    days_lookback:
      type: number
      description: "How many days of resolved tickets to analyze (default: 30)"
      default: 30
    min_cluster_size:
      type: number
      description: "Minimum number of similar tickets to form a FAQ topic (default: 3)"
      default: 3
    notion_page_id:
      type: string
      description: "Notion page ID where FAQ entries will be written"

steps:
  - id: fetch-resolved
    prompt: |
      Fetch resolved/closed Zendesk tickets from the last {input.days_lookback} days
      that have actionable resolutions suitable for FAQ generation.

      Use the Zendesk tool:
        node /home/user/tools/zendesk.mjs list_tickets 'solved,closed' {input.days_lookback}

      For each ticket, extract and return:
      - ticket_id: unique identifier for traceability
      - subject: original ticket subject line
      - description: first 500 chars of the customer's initial message
      - resolution_summary: the final resolution provided by the agent
      - tags: all ticket tags (used for categorization and clustering)
      - category: ticket category or form type
      - satisfaction_rating: CSAT score if the customer rated the interaction
      - number_of_replies: total back-and-forth count (indicates complexity)
      - resolution_time_hours: time from creation to resolution
      - channel: how the ticket was submitted (email, chat, phone, web form)

      **Filtering criteria - INCLUDE tickets that:**
      - Have a clear, actionable resolution (not just "will investigate")
      - Were resolved by an agent (not auto-closed or self-service)
      - Represent questions other customers might also ask

      **EXCLUDE tickets that are:**
      - Closed as spam, duplicate, or "no response needed"
      - Account-specific issues unlikely to recur (billing errors, one-off bugs)
      - Internal tickets or agent-to-agent communications
      - Tickets without any resolution summary or agent reply

      Sort by satisfaction_rating (highest first) to prioritize well-resolved tickets
      as the basis for FAQ content.
    model: haiku
    max_turns: 5
    output_schema:
      type: object
      properties:
        tickets:
          type: array
          items:
            type: object
            properties:
              ticket_id: { type: string, description: "unique Zendesk ticket identifier" }
              subject: { type: string, description: "original ticket subject line" }
              description: { type: string, description: "first 500 chars of the customer message" }
              resolution_summary: { type: string, description: "final resolution provided by the agent" }
              tags: { type: array, items: { type: string }, description: "ticket tags for categorization" }
        total_count: { type: integer, description: "total number of resolved tickets fetched" }

  - id: cluster-topics
    depends_on: [fetch-resolved]
    prompt: |
      Cluster the resolved tickets by topic similarity to identify recurring questions.

      Resolved tickets: {steps.fetch-resolved.output}
      Minimum cluster size: {input.min_cluster_size}

      Group tickets that ask about the same underlying question or issue using semantic
      similarity - not just keyword matching. Tickets asking "how do I cancel" and
      "I want to stop my subscription" belong in the same cluster.

      For each cluster, provide:
      1. **Topic label** - short descriptive name (e.g. "Password Reset", "Billing Cycle")
      2. **Canonical question** - the most common phrasing of this question
      3. **Ticket count** - number of tickets in the cluster
      4. **Ticket IDs** - list of ticket IDs in this cluster
      5. **Key variations** - 3-5 different ways customers phrase this question (important for
         SEO keyword coverage and search discoverability within the help center)
      6. **Category** - getting-started, billing, technical, account, integrations, troubleshooting
      7. **Difficulty tier** - classify each cluster:
         - basic: simple how-to, one-step answers, new user questions
         - intermediate: multi-step processes, configuration, requires some product knowledge
         - advanced: complex troubleshooting, integrations, edge cases, power-user features
      8. **Related clusters** - identify 1-3 other clusters that are topically adjacent
         (e.g. "Password Reset" relates to "Account Lockout" and "Two-Factor Authentication")
      9. **Customer sentiment** - average satisfaction rating for tickets in this cluster
         (indicates pain points vs routine questions)
      10. **Resolution complexity** - average number of agent replies needed to resolve

      Only include clusters with at least {input.min_cluster_size} tickets.
      Rank clusters by ticket count (most frequent first) within each category.

      Return JSON array of topic clusters.
    model: sonnet
    max_turns: 10

  - id: generate-faq
    depends_on: [cluster-topics, fetch-resolved]
    prompt: |
      Generate polished FAQ entries from the ticket clusters and their resolutions.

      Topic clusters: {steps.cluster-topics.output}
      Original tickets: {steps.fetch-resolved.output}

      For each topic cluster, create a polished FAQ entry optimized for both human readability
      and search engine discovery:

      1. **Question** - clear, concise question in the customer's natural voice. Use the exact
         phrasing customers actually use (from ticket data), not internal jargon. Start with
         "How do I...", "Why is...", "Can I...", "What happens when..." for natural language match.
      2. **Short answer** - a single sentence (under 60 words) that directly and completely
         answers the question. This serves as the FAQ schema snippet for search engines and
         should stand alone without needing the full answer.
      3. **Full answer** - comprehensive answer (100-250 words) that:
         - Opens with the direct answer restated clearly
         - Provides numbered step-by-step instructions where applicable
         - Addresses the top 2-3 edge cases or "but what if..." variations from ticket data
         - References specific UI locations ("Go to Settings > Billing > Payment Methods")
         - Includes placeholder links to relevant docs: [Learn more](/docs/topic)
         - Ends with a clear next step or CTA ("If this doesn't resolve your issue, contact support")
         - Uses a friendly, confident tone - never apologetic or hedging
      4. **Category** - from the cluster analysis
      5. **Difficulty tier** - basic / intermediate / advanced (from cluster analysis)
      6. **Related questions** - 2-3 related FAQ entry titles that should be cross-linked,
         with brief context on why they are related
      7. **Keywords** - 5-8 search keywords including synonyms and common misspellings
         that customers use (e.g., "cancel" / "cancellation" / "unsubscribe" / "stop billing")
      8. **FAQ schema markup** - generate JSON-LD structured data (schema.org/FAQPage) for
         each entry so SEO teams can embed it directly:
         ```json
         {"@type": "Question", "name": "...", "acceptedAnswer": {"@type": "Answer", "text": "..."}}
         ```
      9. **Internal notes** - brief note for support agents about edge cases or known issues
         related to this topic that should NOT be in the public FAQ

      Order FAQ entries: first by category, then by difficulty tier (basic first), then by frequency.
      Ensure no two FAQ entries have substantially overlapping answers - if they do, merge them
      and add the alternate question as a redirect/alias.
    model: sonnet
    max_turns: 10
    output_schema:
      type: object
      properties:
        faq_entries:
          type: array
          items:
            type: object
            properties:
              question: { type: string, description: "FAQ question in the customer's natural voice" }
              answer: { type: string, description: "polished answer with steps and edge cases" }
              category: { type: string, description: "FAQ category like billing, technical, or account" }
              keywords: { type: array, items: { type: string }, description: "search keywords including synonyms and misspellings" }
        total_entries: { type: integer, description: "total number of FAQ entries generated" }

  - id: write-to-notion
    depends_on: [generate-faq]
    prompt: |
      Write the generated FAQ entries to the Notion knowledge base.

      FAQ entries: {steps.generate-faq.output}
      Notion page ID: {input.notion_page_id}

      Use the Notion tool:
        node /home/user/tools/notion.mjs append_blocks '{input.notion_page_id}' '<content>'

      Organize and write the content with clear information architecture:

      **Page header:**
      - Title: "Frequently Asked Questions"
      - Last updated timestamp
      - Total number of FAQ entries and categories covered
      - Auto-generated notice: "Generated from {steps.fetch-resolved.output.total_count} resolved
        tickets over the last {input.days_lookback} days"

      **Table of contents:**
      - Linked list of all categories with entry count per category
      - Quick-jump anchors to each section

      **For each category (H2 heading):**
      - Brief category description (1 sentence)
      - Entries organized by difficulty tier with visual indicators:
        - Basic entries first (for new users)
        - Intermediate entries next
        - Advanced entries last (for power users)

      **For each FAQ entry:**
      1. Create a toggle heading (H3) with the question text and difficulty badge
      2. Inside the toggle:
         - Short answer (bold, first line)
         - Full answer as paragraph blocks with numbered steps where applicable
         - "Related questions" section with links to other FAQ entries
         - "Still need help?" callout with support contact link
      3. Add a divider between entries

      **Page footer:**
      - "Didn't find what you're looking for?" with support contact link
      - Feedback mechanism: "Was this helpful? Yes / No"
      - Date range of tickets analyzed

      Report how many entries were written, entries per category, and any errors encountered.
    model: haiku
    max_turns: 10
    tools: [notion]
