pages:
  stage: deploy
  image: node:20-alpine
  script:
    - cd dashboard
    - npm ci
    - GITLAB_PAGES=true npm run build
    - cp dist/index.html dist/404.html
    - cd ..
    - mkdir -p public
    - cp -r dashboard/dist/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
